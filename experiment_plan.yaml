# experiment_plan.yaml — bond-coordinator
#
# The coordinator does not run numerical experiments; it maintains the fleet
# state.  This plan declares the verification experiments that gate the
# package: deterministic assertions over the registry, ledger, and status core.

conditions:
  - name: registry_completeness
    role: reference
    description: "ROSTER holds exactly 27 unique, canon-ordered film packages with valid slugs, films, years, codenames, and concepts."
  - name: ledger_forward_only
    role: reference
    description: "MissionPhase transitions are strictly forward-only; backwards or past-debrief moves raise; audit trail is append-only."
  - name: status_aggregation
    role: proposed
    description: "build_status aggregates counts by status/phase, the coverage summary, and stale/blocked flags from the registry + ledger."
  - name: situation_determinism
    role: variant
    description: "The situation-room HTML is byte-identical across repeated builds with identical inputs, and HTML-escapes all values."

metrics:
  primary:
    name: coverage_pct
    direction: maximize
  secondary:
    - name: transition_violations
      direction: minimize
    - name: output_byte_drift
      direction: minimize

protocol: "Run the zero-mock deterministic suite over a 5-film fixture plus full-registry completeness checks, with a fixed injected clock. Gate at >=90% line+branch coverage on src/."

expected_figures: []
expected_tables:
  - registry_roster
  - status_counts

baselines:
  - registry_completeness
ablations:
  - situation_determinism
