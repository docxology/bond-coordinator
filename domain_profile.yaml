domain: mission_control
display_name: BOND Suite Coordinator
required_packages:
  - pyyaml
  - pytest
preferred_outputs:
  - html
  - json
validation_gates:
  - coverage_90
  - zero_mock
  - ruff
  - mypy
  - determinism
figure_types: []
citation_policy: official_or_scholarly
source_policy: "Coordinator derives all fleet counts from src/bond_coordinator and manuscript/config.yaml; status/coverage are only ever updated from measured gate output, never hand-asserted."
review_gates:
  - registry_completeness
  - ledger_transition_rules
  - status_determinism
