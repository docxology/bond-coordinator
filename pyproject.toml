# bond-coordinator — mission control for the BOND suite.
# Inherits workspace settings from the template root pyproject.toml.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-coordinator"
version = "0.1.0"
license = {text = "MIT"}
description = "Mission control for the BOND suite: film-package registry, mission-state ledger, aggregate status, and situation-room dashboard."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "bond-api",
]

# Local path dependency so scripts/reconcile.py can probe the FROZEN bond-api
# protocol when reconciling the registry against real film packages.
# Relative path (fleet convention, see ../bond-cli): the BOND repos are checked
# out as siblings, so this resolves on any machine.
[tool.uv.sources]
bond-api = { path = "vendor/bond-api" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate.
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]
target-version = "py310"
line-length = 88

[tool.mypy]
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
python_version = "3.10"
files = ["src/bond_coordinator", "scripts"]
mypy_path = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[tool.uv]
# Inherits workspace settings from root pyproject.toml
